name: FASE B - implantar fluxo do site e nomes legíveis (manual)

# Deploy protegido e manual: apenas as Functions de cadastro e edição.
# Nenhum deploy automático na main, nem Hosting, Firestore Rules ou IAM.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toaki-fluxo-site-fase-b
  cancel-in-progress: false

jobs:
  implantar-fluxo:
    if: github.repository == 'perin-dv/ToAki' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    name: Implantar apenas cadastro e edição da empresa piloto
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Usar codigo aprovado da main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar projeto, fluxo e backend
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");if(JSON.parse(fs.readFileSync(".firebaserc")).projects.default!=="toaki-cf058")process.exit(1)'
          npm install --no-audit --no-fund
          npm test
          npm run build
          npm --prefix functions install --no-audit --no-fund
          node --check functions/operacoes.cjs
          node --check functions/alteracoes.cjs
          node --check functions/registro-legivel.cjs
      - name: Validar credencial do projeto original
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TOAKI_CF058 }}
        run: |
          set -euo pipefail
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]]; then echo "::error::Credencial ausente"; exit 1; fi
          umask 077
          CRED="$RUNNER_TEMP/toaki-fluxo-site.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CRED"
          node -e 'const fs=require("fs");const k=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(k.type!=="service_account"||k.project_id!=="toaki-cf058")process.exit(1)' "$CRED"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CRED" >> "$GITHUB_ENV"
      - name: Implantar somente Functions de cadastro e edição
        run: |
          set -euo pipefail
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          npx firebase deploy --only functions:operarEmpresaHomologacao,functions:alterarRegistroEmpresaPiloto --project toaki-cf058 --non-interactive
          echo '### Fase B: fluxo do site implantado' >> "$GITHUB_STEP_SUMMARY"
          echo 'Apenas Functions de cadastro e edição. Nenhum Hosting live/Preview, Rules, IAM ou dados existentes alterados.' >> "$GITHUB_STEP_SUMMARY"
