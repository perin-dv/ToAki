name: FASE C - implantar Functions motoboy (manual e restrito)

# Não altera Hosting Live nem dados existentes. As Rules Storage são procedimento separado.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toaki-fase-c-functions
  cancel-in-progress: false

jobs:
  implantar:
    if: github.repository == 'perin-dv/ToAki' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar política e projeto
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");if(JSON.parse(fs.readFileSync(".firebaserc")).projects.default!=="toaki-cf058")process.exit(1)'
          npm install --no-audit --no-fund
          npm test
          npm --prefix functions install --no-audit --no-fund
          node --check functions/motoboy.cjs
      - name: Autenticar no Firebase piloto
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TOAKI_CF058 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]]; then exit 1; fi
          umask 077
          CRED="$RUNNER_TEMP/toaki-fase-c.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CRED"
          node -e 'const fs=require("fs");const k=JSON.parse(fs.readFileSync(process.argv[1]));if(k.type!=="service_account"||k.project_id!=="toaki-cf058")process.exit(1)' "$CRED"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CRED" >> "$GITHUB_ENV"
      - name: Implantar somente Functions da Fase C
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          npx firebase deploy --only functions:criarConviteMotoboyPiloto,functions:aceitarConviteMotoboyPiloto,functions:listarEntregasMotoboyPiloto,functions:iniciarEntregaMotoboyPiloto,functions:enviarGpsMotoboyPiloto,functions:pararGpsMotoboyPiloto,functions:concluirEntregaMotoboyPiloto,functions:registrarPushMotoboyPiloto --project toaki-cf058 --non-interactive
          echo 'Functions da Fase C implantadas. Hosting Live/Storage/Firestore Rules não alterados.' >> "$GITHUB_STEP_SUMMARY"
