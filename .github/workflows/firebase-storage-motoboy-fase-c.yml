name: FASE C - publicar Storage Rules (aprovação explícita)

on:
  workflow_dispatch:
    inputs:
      aprovacao:
        description: 'Digite PUBLICAR_STORAGE_FASE_C após revisão das regras no Firebase'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: toaki-fase-c-storage
  cancel-in-progress: false

jobs:
  implantar:
    if: github.repository == 'perin-dv/ToAki' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && inputs.aprovacao == 'PUBLICAR_STORAGE_FASE_C'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checar Rules e projeto
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");if(JSON.parse(fs.readFileSync(".firebaserc")).projects.default!=="toaki-cf058")process.exit(1)'
          node --test tests/storage-rules-policy.test.cjs
      - name: Validar credencial
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TOAKI_CF058 }}
        run: |
          set -euo pipefail
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]]; then exit 1; fi
          umask 077
          CRED="$RUNNER_TEMP/toaki-fase-c-storage.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CRED"
          node -e 'const fs=require("fs");const k=JSON.parse(fs.readFileSync(process.argv[1]));if(k.project_id!=="toaki-cf058"||k.type!=="service_account")process.exit(1)' "$CRED"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CRED" >> "$GITHUB_ENV"
      - name: Publicar apenas Storage Rules (altera regras do bucket)
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          npm install --no-audit --no-fund
          npx firebase deploy --only storage --project toaki-cf058 --non-interactive
          echo 'Storage Rules Fase C publicadas com aprovação explícita. Hosting e Firestore Rules não alterados.' >> "$GITHUB_STEP_SUMMARY"
