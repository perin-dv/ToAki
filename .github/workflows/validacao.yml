name: Validar front-end

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar-frontend:
    name: Validar frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Verificar configuracao e arquivos
        run: node --test tests/*.test.mjs
      - name: Compilar front-end
        run: npm run build
      - name: Verificar saida para Firebase Hosting
        run: node -e "const fs=require('node:fs'); if(!fs.existsSync('dist/index.html')) process.exit(1);"
