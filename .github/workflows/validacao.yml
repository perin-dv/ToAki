name: Validar front-end

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar-frontend:
    name: Validar frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Configurar Java para o Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verificar configuracao e arquivos
        run: node --test tests/protecao.test.mjs
      - name: Testar isolamento de dados no Firestore Emulator
        run: npm run test:security
      - name: Testar regras de aprovação de empresas (sem acessar produção)
        run: node --test tests/company-policy.test.cjs
      - name: Conferir sintaxe do backend privado
        run: node --check functions/index.cjs
      - name: Compilar front-end
        run: npm run build
      - name: Verificar saida para Firebase Hosting
        run: node -e "const fs=require('node:fs'); if(!fs.existsSync('dist/index.html')) process.exit(1);"
      - name: Instalar Playwright para testar navegação móvel real
        run: npm install --no-save --no-audit --no-fund @playwright/test
      - name: Preparar navegador Chromium de teste
        run: npx playwright install --with-deps chromium
      - name: Testar menus no celular e desktop
        run: npx playwright test
