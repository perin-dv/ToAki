<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#1a2633;background:#f5f7f9;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #ffb46a;outline-offset:2px}.app{display:flex;min-height:100vh}.sidebar{width:232px;background:#fff;border-right:1px solid #e8ebef;padding:23px 14px;display:flex;flex-direction:column;gap:5px;flex-shrink:0}.brand{display:flex;align-items:center;padding:10px 12px 24px}.sidebar .brand{padding:8px 8px 24px}.brand-logo{display:block;width:188px;height:auto;aspect-ratio:370/122;object-fit:contain;border-radius:12px}.mobile-top .brand{padding:0}.mobile-top .brand-logo{width:146px;border-radius:8px}.nav{border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:11px;color:#556473;display:flex;align-items:center;gap:12px;font-weight:550;font-size:13px}.nav.active{background:linear-gradient(105deg,#ff9d09,#ff5b08);color:#fff;box-shadow:0 4px 12px #ff7e332b}.nav:hover:not(.active){background:#f2f5f7}.nav .ico{width:20px;text-align:center;font-size:17px}.side-bottom{margin-top:auto;border-top:1px solid #e8edf0;padding:18px 12px 4px;font-size:12px;color:#788694;line-height:1.6}.side-bottom strong{display:block;color:#1d2b38}.main{flex:1;min-width:0;padding:24px 26px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.heading h1{font-size:24px;margin:0 0 5px;letter-spacing:-.6px}.heading p{font-size:12px;color:#8b96a3;margin:0}.profile{display:flex;align-items:center;gap:12px;color:#596777;font-size:12px}.avatar{background:#edf1f5;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;font-size:18px}.online{color:#12885c;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:17px}.stat,.panel,.map-shell{background:#fff;border:1px solid #edf0f2;border-radius:14px;box-shadow {outline:3px solid #ff9b3b}.right{display:flex;flex-direction:column;gap:15px;min-width:0}.panel{padding:16px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.subtle{font-size:11px;color:#8b98a5}.delivery{width:100%;border:1px solid transparent;background:#f9fafb;text-align:left;display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;margin-top:8px}.delivery.selected{border-color:#ff9b61;background:#fff7f0}.delivery .bike{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:#fff0e6;font-size:16px}.delivery .copy{flex:1;min-width:0}.delivery strong{font-size:12px}.delivery small{display:block;font-size:10px;color:#86929d;margin-top:3px}.delivery .side{text-align:right}.pill{background:#e0f6eb;color:#087c4a;font-weight:700;font-size:9px;padding:4px 7px;border-radius:5px}.pill.wait{background:#eff2f4;color:#7b8790}.delivery .side small{margin-top:8px}.mini-stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mini-stat>div{border-radius:10px;background:#f8fafb;padding:10px 5px;text-align:center}.mini-stat strong{display:block;font-size:17px}.mini-stat small{font-size:9px;color:#8b95a0}.mini-stat .orange{color:#ff710d}.details{font-size:12px;color:#617080;line-height:1.7}.details strong{color:#1a2633}.details .cta{margin-top:12px}.cta{background:linear-gradient(100deg,#ff9c0b,#ff5c07);color:white;border:0;padding:12px 16px;font-weight:700;border-radius:9px;font-size:12px;width:100%}.secondary{background:white;border:1px solid #dde3e7;padding:11px;border-radius:9px;font-weight:650;font-size:12px}.page-card{background:#fff;border:1px solid #e9edef;border-radius:15px;padding:20px}.page-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:19px;gap:12px}.page-title h2{margin:0;font-size:18px}.table{width:100%;border-collapse:collapse}.table th{text-align:left;font-size:11px;color:#8b96a1;padding:14px 10px;border-bottom:1px solid #e9edf0}.table td{font-size:12px;padding:16px 10px;border-bottom:1px solid #f0f2f4}.table tr:hover td{background:#fbfcfd}.grid-card{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.tile{border:1px solid #edf0f2;border-radius:12px;padding:17px}.tile strong{display:block;margin:10px 0 5px}.tile small{color:#7b8995}.toast{position:fixed;right:18px;bottom:18px;background:#17212c;color:#fff;font-size:12px;padding:13px 18px;border-radius:10px;box-shadow:0 9px 30px #0002;max-width:340px;z-index:20}.hidden{display:none!important}.mobile-top{display:none}.mobile-nav{display:none}@media(max-width:1120px){.content-grid{grid-template-columns:minmax(0,1fr)}.fake-map{height:390px}.right{display:grid;grid-template-columns:1fr 1fr}.right>.panel:first-child{grid-row:span 2}}@media(max-width:760px){.sidebar{display:none}.main{padding:14px 12px 85px}.mobile-top{display:flex;background:#fff;border-bottom:1px solid #e7ebee;padding:12px 16px;align-items:center;justify-content:space-between}.mobile-top .brand{padding:0;font-size:22px}.top{margin:5px 0 15px}.heading h1{font-size:20px}.profile .person-label{display:none}.stats{grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:10px}.stat strong{font-size:21px}.stat .symbol{padding:8px;font-size:18px}.fake-map{height:370px}.right{display:flex}.grid-card{grid-template-columns:1fr}.table-wrap{overflow:auto}.table{min-width:650px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e8ecf0;z-index:10;justify-content:space-around;padding:8px 2px max(8px,env(safe-area-inset-bottom))}.mobile-nav button{border:0;background:transparent;display:grid;gap:4px;place-items:center;color:#8b929c;font-size:10px}.mobile-nav button.on{color:#ff690a;font-weight:800}.mobile-nav button b{font-size:18px}.maphead{flex-wrap:wrap}.search{max-width:none;flex-basis:100%}}

<body>
<div class="mobile-top"><div class="brand"><img class="brand-logo" src="/logo-toaki.webp" width="370" height="122" alt="toAki — Rastreie suas entregas em tempo real" decoding="async"></div><span>🔔　☻</span></div>
<div class="app"><aside class="sidebar"><div class="brand"><img class="brand-logo" src="/logo-toaki.webp" width="370" height="122" alt="toAki — Rastreie suas entregas em tempo real" decoding="async"></div><div id="side-nav"></div><div class="side-bottom"><strong>Soma Distribuidora</strong>Filial Maringá<br>Protótipo de interface • v0.1</div></aside>
<main class="main"><header class="top"><div class="heading"><h1 id="page-name">Central de rastreamento</h1><p>Segunda-feira, 19 de outubro de 2026 · Ambiente de demonstração</p></div><div class="profile"><span class="online">● Simulação ativa</span><span class="person-label">João · Vendedor</span><div class="avatar">👤</div></div></header><div id="page"></div></main></div><nav class="mobile-nav" id="mobile-nav"></nav><div id="toast" class="toast hidden"></div>
<script>
const menu=[['inicio','Início','⌂'],['entregas','Entregas e NFs','▣'],['entregadores','Entregadores','♧'],['clientes','Clientes e links','♧'],['comprovantes','Comprovantes','✓'],['historico','Histórico e relatórios','◷'],['empresa','Empresa e equipe','▤'],['assinatura','Assinatura','▧']];
const deliveries=[{nf:'0045821',person:'João Silva',place:'Zona 07, Maringá',status:'Em rota',eta:'12 min',x:38,y:36},{nf:'0045822',person:'Carlos Lima',place:'Jardim Alvorada',status:'Em rota',eta:'22 min',x:72,y:63},{nf:'0045823',person:'Marcos Reis',place:'Centro, Maringá',status:'Aguardando coleta',eta:'—',x:49,y:80}];
let current='inicio',selected=0,filter='';
function notice(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(window.noticeTimer);window.noticeTimer=setTimeout(()=>t.classList.add('hidden'),3200)}
function nav(id){current=id;document.querySelector('#page-name').textContent=({inicio:'Central de rastreamento',entregas:'Entregas e notas fiscais',entregadores:'Entregadores e veículos',clientes:'Rastreamento de clientes',comprovantes:'Comprovantes de entrega',historico:'Histórico e relatórios',empresa:'Empresa e funcionários',assinatura:'Gestão de assinatura'})[id];draw()}
function buttons(){document.querySelector('#side-nav').innerHTML=menu.map(([id,label,ico])=>'<button class="nav '+(current===id?'active':'')+'" onclick="nav(\''+id+'\')"><span class="ico">'+ico+'</span>'+label+'</button>').join('');document.querySelector('#mobile-nav').innerHTML=[menu[0],menu[1],menu[2],['empresa','Mais','☷']].map(([id,label,ico])=>'<button class="'+(current===id?'on':'')+'" onclick="nav(\''+id+'\')"><b>'+ico+'</b>'+label+'</button>').join('')}
const mapSvg='<svg viewBox="0 0 720 510" preserveAspectRatio="xMidYMid slice" aria-label="Mapa ilustrativo de Maringá"><rect width="720" height="510" fill="#e7eeea"/><g fill="#cee0d4"><path d="M20 20h120v85H20zM565 18h129v80H565zM555 340h145v125H555zM20 320h115v158H20z" /><path d="M260 220h55v90h-55z"/></g><g stroke="#ffffff" stroke-width="14" fill="none"><path d="M0 55H720M0 125H720M0 205H720M0 286H720M0 368H720M0 450H720"/><path d="M65 0V510M155 0V510M240 0V510M335 0V510M432 0V510M520 0V510M630 0V510"/></g><g stroke="#c6d9e7" stroke-width="7" fill="none"><path d="M-20 490 600-20M700 520 180-20"/></g><g font-family="Arial" fill="#87999b" font-size="14"><text x="24" y="175">AV. BRASIL</text><text x="380" y="90">ZONA 07</text><text x="510" y="255">MARINGÁ</text><text x="100" y="414">CENTRO</text><text x="530" y="495">JARDIM ALVORADA</text></g><path d="M108 330L270 330L270 184L355 184L355 115" fill="none" stroke="#ff780d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 7"/><path d="M355 184L520 184L520 320" fill="none" stroke="#f6ac3a" stroke-width="5" stroke-dasharray="12 7"/></svg>';
function mapBlock(){return '<div class="map-shell"><div class="maphead"><h2>Mapa de entregadores</h2><div class="search">⌕ <input id="search" placeholder="Buscar nota fiscal, pedido, entregador..." value="'+filter.replace(/"/g,'&quot;')+'" oninput="searchChange(this.value)"></div></div><div class="fake-map">'+mapSvg+'<div class="map-note">📍 Maringá, PR • mapa ilustrativo</div>'+deliveries.map((d,i)=>'<button class="marker '+(selected===i?'selected':'')+'" style="left:'+d.x+'%;top:'+d.y+'%" onclick="choose('+i+')"><span class="marker-bubble">🛵</span><span class="marker-label"><b>'+d.person.split(' ')[0]+'</b><em>'+d.status+'</em></span></button>').join('')+'<div class="map-controls"><button onclick="notice(\'Zoom ilustrativo — mapa demonstrativo\')">+</button><button onclick="notice(\'Zoom ilustrativo — mapa demonstrativo\')">−</button></div></div></div>'}
function searchChange(v){filter=v;renderRight()}
function choose(i){selected=i;filter='';draw()}
function renderRight(){const d=deliveries[selected],matches=deliveries.filter(x=>(x.nf+' '+x.person+' '+x.place).toLowerCase().includes(filter.toLowerCase()));const el=document.querySelector('#right');if(!el)return;el.innerHTML='<section class="panel"><div class="panelhead"><h2>Entregas em andamento</h2><span class="subtle">Demonstração</span></div>'+ (matches.length?matches.map(o=>{let i=deliveries.indexOf(o);return '<button class="delivery '+(i===selected?'selected':'')+'" onclick="choose('+i+')"><span class="bike">🛵</span><span class="copy"><strong>NF '+o.nf+'</strong><small>'+o.person+' · '+o.place+'</small></span><span class="side"><span class="pill '+(o.status!=='Em rota'?'wait':'')+'">'+o.status+'</span><small>'+o.eta+'</small></span></button>'}).join(''):'<p class="subtle">Nenhuma entrega encontrada.</p>')+'</section><section class="panel"><div class="panelhead"><h2>Resumo do dia</h2><span class="subtle">19/10/2026</span></div><div class="mini-stat"><div><strong class="orange">18</strong><small>Entregas</small></div><div><strong>07</strong><small>Em rota</small></div><div><strong style="color:#14a466">09</strong><small>Entregues</small></div><div><strong style="color:#e24747">02</strong><small>Pendentes</small></div></div></section><section class="panel"><div class="panelhead"><h2>Detalhes da entrega</h2><span class="pill '+(d.status!=='Em rota'?'wait':'')+'">'+d.status+'</span></div><div class="details"><strong>NF '+d.nf+'</strong><br>Entregador: '+d.person+'<br>Destino: '+d.place+'<br>Previsão: <strong>'+d.eta+'</strong><br>Última localização: <strong>há 8 segundos (simulado)</strong></div><button class="cta" onclick="nav(\'entregas\')">Ver detalhes da entrega →</button></section>'}
function draw(){buttons();const page=document.querySelector('#page');if(current==='inicio'){page.innerHTML='<div class="stats">'+[['📦','18','Entregas hoje'],['🛵','07','Em rota'],['✅','09','Entregues'],['⏱','02','Pendentes']].map(s=>'<div class="stat"><span class="symbol">'+s[0]+'</span><div><strong>'+s[1]+'</strong><small>'+s[2]+'</small></div></div>').join('')+'</div><div class="content-grid">'+mapBlock()+'<aside class="right" id="right"></aside></div>';renderRight();return}
if(current==='entregas'){page.innerHTML='<div class="page-card"><div class="page-title"><h2>Entregas registradas</h2><button class="cta" style="width:auto" onclick="notice(\'Cadastro será implementado na etapa funcional.\')">+ Nova entrega</button></div><div class="table-wrap"><table class="table"><thead><tr><th>NOTA FISCAL</th><th>ENTREGADOR</th><th>DESTINO</th><th>STATUS</th><th>PREVISÃO</th><th>AÇÃO</th></tr></thead><tbody>'+deliveries.map((d,i)=>'<tr><td><b>'+d.nf+'</b></td><td>'+d.person+'</td><td>'+d.place+'</td><td><span class="pill '+(d.status!=='Em rota'?'wait':'')+'">'+d.status+'</span></td><td>'+d.eta+'</td><td><button class="secondary" onclick="selected='+i+';nav(\'inicio\')">Ver mapa</button></td></tr>').join('')+'</tbody></table></div></div>';return}
const info={entregadores:[['João Silva','Moto 03 · Em rota'],['Carlos Lima','Moto 07 · Em rota'],['Marcos Reis','Moto 02 · Disponível']],clientes:[['Link para NF 0045821','Disponível para compartilhamento'],['Acesso do cliente','Status, mapa e previsão estimada'],['Segurança','Link temporário e revogável']],comprovantes:[['NF 0045810','Foto do recebimento · Exemplo'],['NF 0045811','Assinatura · Exemplo'],['Ocorrências','Registrar tentativa sem sucesso']],historico:[['Entregas realizadas','09 hoje'],['Tempo médio de entrega','27 minutos · Fictício'],['Relatórios','Filtros por NF, período e entregador']],empresa:[['Soma Distribuidora','Filial Maringá'],['Funcionários','Vendedores, gestores e administrador'],['Permissões','Acesso isolado por empresa']],assinatura:[['Plano atual','Demonstração'],['Entregadores ativos','04 · Exemplo'],['Cobrança','Não habilitada nesta versão']]};page.innerHTML='<div class="page-card"><div class="page-title"><h2>'+document.querySelector('#page-name').textContent+'</h2><span class="pill wait">Protótipo visual</span></div><div class="grid-card">'+info[current].map(a=>'<div class="tile"><span style="color:#ff770c;font-size:23px">◉</span><strong>'+a[0]+'</strong><small>'+a[1]+'</small></div>').join('')+'</div><div style="margin-top:22px;padding:15px;background:#fff7f0;border-radius:10px;font-size:12px;color:#946331">Esta tela apresenta a estrutura do módulo. As ações reais, persistência de dados e Firebase serão adicionados após a aprovação do visual.</div></div>'}
draw();
</script>
</body></html>
